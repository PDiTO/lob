[package]
name = "lob-python"
description = "Python bindings for the lob order book and backtester"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
name = "_lob"
crate-type = ["cdylib"]

[dependencies]
lob.workspace = true
pyo3 = { version = "=0.25.1", features = ["abi3-py310", "extension-module"] }
serde_json = "=1.0.140"
