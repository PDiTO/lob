[package]
name = "lob"
description = "Price-time priority limit order book, market data views and an event-driven backtester"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["orderbook", "matching-engine", "backtesting", "market-making", "trading"]
categories = ["finance", "simulation"]

[dependencies]
rustc-hash = "=2.1.1"
serde = { version = "=1.0.219", features = ["derive"] }
thiserror = "=2.0.12"
toml = "=0.8.23"

[dev-dependencies]
criterion = "=0.6.0"
proptest = "=1.7.0"


[[bench]]
name = "book"
harness = false
