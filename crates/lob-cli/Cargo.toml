[package]
name = "lob-cli"
description = "Command-line tools for the lob order book: benchmarks, backtests and feed generation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "lob"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.98"
clap = { version = "=4.5.40", features = ["derive"] }
lob.workspace = true
serde_json = "=1.0.140"
